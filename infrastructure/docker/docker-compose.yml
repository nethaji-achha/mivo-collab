version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: mivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mivo_user
      POSTGRES_PASSWORD: mivo_secure_password_2026
      POSTGRES_DB: mivo_collab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mivo_user -d mivo_collab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Presence & BullMQ Queues
  redis:
    image: redis:7-alpine
    container_name: mivo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. REST API Service
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: mivo-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://mivo_user:mivo_secure_password_2026@postgres:5432/mivo_collab
      REDIS_URL: redis://redis:6379
      JWT_SECRET: mivo_collab_super_secret_jwt_key_2026
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. WebRTC Signaling & Socket Server
  signaling:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.signaling
    container_name: mivo-signaling
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - redis

  # 5. Background Task Worker
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: mivo-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - redis

  # 6. Next.js Web Frontend
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: mivo-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SIGNALING_URL: http://localhost:4001
      NODE_ENV: production
    depends_on:
      - api
      - signaling

volumes:
  postgres_data:
  redis_data:
